# cifarium: settings for nginx. Include this file inside the `server { }` block that serves the
# build folder (its `root` is the folder with cifarium.json):
#
#     include /path/to/the/folder/hosting/nginx.conf;
#
# If the folder is a subfolder of your site, put its path in front of every path below
# (/cifarium/vendor/, ...).
#
# The model computes in several threads only on a page that is cross-origin isolated. The two
# headers make it so. They go on the page that runs the model, on cifarium-worker.js and on
# vendor/: ONNX Runtime starts its own threads from the files there, and an isolated page
# refuses a thread script that does not carry them, so the model would not start at all.
# If your own page runs the model instead of index.html, add the same two headers to it.
#
# `Cross-Origin-Embedder-Policy: require-corp` blocks images, scripts and fonts from other sites
# that do not allow it. Put the headers only on the pages that run the model.
#
# vendor/ and models/ have the version in their paths, so their files never change at an
# address and may be kept for a year. The rest changes at the same address when you build
# again, so the browser has to ask the server whether it is still current (`no-cache`).
#
# `add_header` of a location replaces every one set outside it, so each location below says
# all it needs.

location ~ ^/(index\.html)?$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;
}

location = /cifarium-worker.js {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;
}

location /vendor/ {
    # Older nginx does not know .mjs: without this the browser refuses the loader as a module.
    # `types` replaces the whole table of the location, so .js and .wasm are named too.
    types {
        text/javascript js mjs;
        application/wasm wasm;
    }
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /models/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/(cifarium\.json|cifarium\.js|data/.*)$ {
    add_header Cache-Control "no-cache" always;
}

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cifarium"
dynamic = ["version"]
description = "Find the smallest model that handles your examples right in the browser."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Talgat" }]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49",
    "PyYAML>=6.0",
    "huggingface_hub>=0.26",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Cifarium/cifarium"
Issues = "https://github.com/Cifarium/cifarium/issues"

[project.scripts]
cifarium = "cifarium.cli:main"

[tool.hatch.version]
path = "src/cifarium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cifarium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: starts the installed Chrome; needs the network on the first run"]
addopts = "-m 'not e2e'"

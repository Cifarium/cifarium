[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cifarium"
dynamic = ["version"]
description = "Find the smallest model that handles your examples right in the browser."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49",
    "PyYAML>=6.0",
    "huggingface_hub>=0.26",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cifarium = "cifarium.cli:main"

[tool.hatch.version]
path = "src/cifarium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cifarium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

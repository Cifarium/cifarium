name: tests

# Every push and pull request: the ordinary tests on the three systems at both ends of the
# supported Python range, and one end-to-end run in Chrome on Linux. The "-latest" labels move
# to a newer system image from time to time (ubuntu-latest went to Ubuntu 26 in autumn 2026);
# a run that turns red after such a move is a finding, not noise. The button runs the same
# jobs without a commit, for example after the image got a new Chrome.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # A red system must not hide the results of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the test tools
        run: python -m pip install -e ".[dev]"
      - name: Run the ordinary tests
        run: python -m pytest

  e2e:
    name: end to end (ubuntu-latest, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the test tools
        run: python -m pip install -e ".[dev]"
      # cifarium drives the Chrome that is already installed; the Ubuntu image has it.
      # Without it this step fails and says so, instead of a Playwright error later.
      - name: Show the installed Chrome
        run: google-chrome --version
      - name: Find the cifarium cache folder
        id: cache-dir
        run: echo "path=$(python -c 'from cifarium import paths; print(paths.cache_dir())')" >> "$GITHUB_OUTPUT"
      # Only the downloads: the engine and the models. The key is made of the files that pin
      # what gets downloaded: the engine versions (vendor.py), the examples of the end-to-end
      # build, which decide the models it runs (tests/test_build_e2e.py), and the catalog. A
      # cache that is hit by its exact key is not saved again, so when the end-to-end test starts
      # to download something these files do not name, add the file that names it here.
      - name: Restore the engine and the models
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.cache-dir.outputs.path }}/vendor
            ${{ steps.cache-dir.outputs.path }}/models
          key: e2e-${{ runner.os }}-${{ hashFiles('src/cifarium/vendor.py', 'tests/test_build_e2e.py', 'src/cifarium/catalog/**') }}
      # The runner has no graphics card and no screen. The test never asks for a card, so the
      # bench starts Chrome without a window and computes on the processor.
      - name: Run the end-to-end test
        run: python -m pytest -m e2e
